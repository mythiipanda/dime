name: build-backend
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        default: latest
        type: string
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
permissions:
  packages: write
env:
  DIME_WAREHOUSE_URL: https://dimewarehouse.blob.core.windows.net/warehouse/dime_data_full.zip
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch warehouse data (blob, checksum-verified)
        run: bash scripts/fetch-data.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: DIME_REVISION=${{ github.sha }}
          tags: ghcr.io/mythiipanda/dime-backend:${{ inputs.image_tag || 'latest' }}
