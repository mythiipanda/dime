name: build-backend
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        default: latest
        type: string
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-backend.yml'
      - '.github/actions/**'
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-backend.yml'
      - '.github/actions/**'
permissions:
  packages: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      analyst: ${{ steps.f.outputs.analyst }}
      container: ${{ steps.f.outputs.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
            analyst:
              - 'backend/analyst/**'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
            container:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/analyst/package.json'
              - 'backend/analyst/package-lock.json'
              - 'backend/analyst/tsconfig.json'
              - 'backend/analyst/gen-manifest.mjs'
              - 'backend/analyst/*.py'
              - 'backend/analyst/*.ts'
              - 'backend/analyst/tools/**'
              - 'backend/analyst/skills/**'
              - 'backend/analyst/http-assets/**'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
  test:
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Enforce the zero-comment rule
        run: python backend/scripts/no_comments.py
      - name: Prove the zero-comment scanner still detects violations
        run: python backend/scripts/no_comments.py --self-test
      - name: Reject leftover merge-conflict markers
        run: python backend/scripts/no_conflict_markers.py
      - name: Prove the marker scanner still detects violations
        run: python backend/scripts/no_conflict_markers.py --self-test
      - uses: ./.github/actions/fetch-warehouse
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pytest-xdist
      - name: Run backend test suite
        run: python -m pytest $(ls backend/tests/test_*.py | awk -v n=2 -v i=${{ matrix.shard }} 'NR%n==i') -q -m "not canonical_warehouse" -n 4
  frontend:
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Typecheck the frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Run the frontend test suite
        run: npm test
        working-directory: frontend
  analyst:
    if: github.event_name != 'pull_request' || needs.changes.outputs.analyst == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install backend and analyst dependencies
        run: pip install -r backend/requirements.txt & (cd backend/analyst && bun install --frozen-lockfile) & wait
      - name: Run the analyst suites
        run: npm test
        working-directory: backend/analyst
  container-smoke:
    if: github.event_name == 'pull_request' && needs.changes.outputs.container == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the analyst packaging stage without publishing
        run: docker build --target analyst-deps --progress=plain -t dime-backend-analyst-smoke:${{ github.sha }} .
        working-directory: backend
  build:
    if: github.event_name != 'pull_request'
    needs: [changes, test, frontend, analyst]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-warehouse
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: DIME_REVISION=${{ github.sha }}
          tags: ghcr.io/mythiipanda/dime-backend:${{ inputs.image_tag || 'latest' }}
