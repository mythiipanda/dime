name: build-backend
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        default: latest
        type: string
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-backend.yml'
      - '.github/actions/**'
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-backend.yml'
      - '.github/actions/**'
permissions:
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Enforce the zero-comment rule
        run: python backend/scripts/no_comments.py
      - name: Prove the zero-comment scanner still detects violations
        run: python backend/scripts/no_comments.py --self-test
      - name: Reject leftover merge-conflict markers
        run: python backend/scripts/no_conflict_markers.py
      - name: Prove the marker scanner still detects violations
        run: python backend/scripts/no_conflict_markers.py --self-test
      - uses: ./.github/actions/fetch-warehouse
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run backend test suite
        run: python -m pytest backend/tests -q -m "not canonical_warehouse"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck the frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Run the frontend test suite
        run: npm test
        working-directory: frontend
  analyst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install analyst dependencies
        run: npm ci --ignore-scripts
        working-directory: backend/analyst
      - name: Run the analyst suites
        run: npm test
        working-directory: backend/analyst
  build:
    if: github.event_name != 'pull_request'
    needs: [test, frontend, analyst]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-warehouse
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: DIME_REVISION=${{ github.sha }}
          tags: ghcr.io/mythiipanda/dime-backend:${{ inputs.image_tag || 'latest' }}
