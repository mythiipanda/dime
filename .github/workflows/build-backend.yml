name: build-backend
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        default: latest
        type: string
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
permissions:
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run contract-boundary gate subset
        run: |
          python -m pytest backend/tests/test_sql_rerun_hardening.py backend/tests/test_v2_wire_schema_strip.py -q
  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch warehouse data (release asset)
        run: |
          curl -L -o /tmp/dime_data.zip https://github.com/mythiipanda/dime/releases/download/dime-data-20260930/dime_data_full.zip
          unzip -q /tmp/dime_data.zip -d backend
          ls -la backend/data | head
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: DIME_REVISION=${{ github.sha }}
          tags: ghcr.io/mythiipanda/dime-backend:${{ inputs.image_tag || 'latest' }}
